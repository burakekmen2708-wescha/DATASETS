<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DATASETS</title>
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DATASETS">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --bg: #eef1f6;
    --dot: #c9cfda;
    --glass: rgba(255, 255, 255, 0.68);
    --glass-strong: rgba(255, 255, 255, 0.85);
    --card: #ffffff;
    --field: rgba(116, 128, 152, 0.13);
    --text: #1c1f26;
    --muted: #697082;
    --faint: #9aa1b2;
    --line: rgba(20, 25, 40, 0.09);
    --line2: rgba(20, 25, 40, 0.16);
    --accent: #007aff;
    --accent-text: #ffffff;
    --accent-soft: rgba(0, 122, 255, 0.13);
    --wire: #b9c1cf;
    --danger: #ff3b30;
    --shadow: 0 1px 2px rgba(25, 30, 50, 0.05), 0 10px 30px rgba(25, 30, 50, 0.10);
    --shadow-lg: 0 4px 12px rgba(25, 30, 50, 0.08), 0 24px 60px rgba(25, 30, 50, 0.18);
    --focus: 0 0 0 3px rgba(0, 122, 255, 0.30);
    --blur: saturate(180%) blur(22px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116;
      --dot: #262c38;
      --glass: rgba(24, 28, 36, 0.62);
      --glass-strong: rgba(30, 35, 45, 0.86);
      --card: #1a1f28;
      --field: rgba(255, 255, 255, 0.09);
      --text: #eef1f6;
      --muted: #98a0b3;
      --faint: #5d6577;
      --line: rgba(255, 255, 255, 0.08);
      --line2: rgba(255, 255, 255, 0.15);
      --accent: #0a84ff;
      --accent-text: #ffffff;
      --accent-soft: rgba(10, 132, 255, 0.17);
      --wire: #39404f;
      --danger: #ff453a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.38);
      --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.35), 0 24px 60px rgba(0, 0, 0, 0.5);
      --focus: 0 0 0 3px rgba(10, 132, 255, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116;
    --dot: #262c38;
    --glass: rgba(24, 28, 36, 0.62);
    --glass-strong: rgba(30, 35, 45, 0.86);
    --card: #1a1f28;
    --field: rgba(255, 255, 255, 0.09);
    --text: #eef1f6;
    --muted: #98a0b3;
    --faint: #5d6577;
    --line: rgba(255, 255, 255, 0.08);
    --line2: rgba(255, 255, 255, 0.15);
    --accent: #0a84ff;
    --accent-text: #ffffff;
    --accent-soft: rgba(10, 132, 255, 0.17);
    --wire: #39404f;
    --danger: #ff453a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.38);
    --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.35), 0 24px 60px rgba(0, 0, 0, 0.5);
    --focus: 0 0 0 3px rgba(10, 132, 255, 0.35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  input, textarea, select { font: inherit; color: var(--text); }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline: none; box-shadow: var(--focus);
  }
  .mono { font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, monospace; }
  .ic {
    width: 15px; height: 15px; flex: none;
    stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  /* the UI itself never zooms (like a native app): no double-tap zoom
     anywhere; only the map canvas zooms, via its own pointer handlers */
  html, body { touch-action: manipulation; }

  /* ---------- canvas ---------- */
  #canvas {
    position: fixed; inset: 0;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.1px, transparent 1.1px);
    background-size: 52px 52px;
    cursor: grab;
    touch-action: none;
  }
  #canvas.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  #wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #wires path { fill: none; stroke-width: 2; stroke-linecap: round; opacity: .8; transition: opacity .25s; }
  #wires path.dimmed { opacity: .1; }

  /* ---------- nodes ---------- */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    min-width: 150px; max-width: 210px;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
    transition: opacity .25s, box-shadow .25s;
  }
  .node:hover { box-shadow: var(--shadow-lg); }
  .node.dimmed { opacity: .15; }
  .node .strip { position: absolute; left: 0; right: 0; top: 0; height: 3.5px; background: transparent; }
  .node .inner { padding: 11px 14px 12px; }
  .node .kind {
    font-size: 11px; font-weight: 500;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
  }
  .node .kind .ic { width: 13px; height: 13px; stroke-width: 2; }
  .node .nm { font-weight: 600; font-size: 14px; line-height: 1.3; letter-spacing: -0.015em; }
  .node .prev {
    font-size: 12px; color: var(--muted); line-height: 1.45;
    margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .node .dots { display: flex; gap: 4px; margin-top: 8px; }
  .node .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }

  .node.me {
    border-radius: 999px;
    border: none;
    box-shadow: 0 0 0 1.5px var(--accent), var(--shadow-lg);
    min-width: 0; max-width: none;
  }
  .node.me .inner { padding: 12px 36px 14px; text-align: center; }
  .node.me .kind { justify-content: center; margin-bottom: 2px; white-space: nowrap; }
  .node.me .nm { font-size: 18px; letter-spacing: -0.02em; white-space: nowrap; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--accent-soft), 0 0 0 1.5px var(--accent), var(--shadow); }
    50% { box-shadow: 0 0 0 18px transparent, 0 0 0 2px var(--accent), var(--shadow); }
    100% { box-shadow: 0 0 0 0 transparent, 0 0 0 1.5px var(--accent), var(--shadow); }
  }
  .node.pulse { animation: pulse 1.1s ease-out 2; }
  @media (prefers-reduced-motion: reduce) {
    .node.pulse { animation: none; box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  }

  /* ---------- floating glass top bar ---------- */
  #topbar {
    position: fixed;
    top: calc(var(--sat) + 2px); left: 10px; right: 10px;
    height: 56px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px 0 16px;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    z-index: 30;
  }
  #logo {
    font-weight: 700; font-size: 15px; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 8px;
    padding-right: 4px;
    white-space: nowrap;
  }
  #logo .mark { width: 19px; height: 19px; flex: none; }
  #logo .mark path { fill: var(--accent); }
  #searchwrap { position: relative; flex: 0 1 420px; min-width: 130px; }
  #search {
    width: 100%;
    background: var(--field);
    border: none; border-radius: 999px;
    padding: 9px 34px 9px 34px;
    font-size: 14px;
  }
  #search::placeholder { color: var(--faint); }
  #searchwrap .mag {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--faint); pointer-events: none; display: flex;
  }
  #searchwrap kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-family: ui-monospace, 'SF Mono', monospace; font-size: 10px;
    background: var(--field); border-radius: 6px;
    padding: 2px 6px; color: var(--faint); pointer-events: none;
  }
  #results {
    position: absolute; top: calc(100% + 10px); left: 0; right: 0;
    background: var(--glass-strong);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    max-height: 320px; overflow-y: auto;
    z-index: 40;
  }
  .result {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 15px; cursor: pointer;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
  }
  .result:last-child { border-bottom: none; }
  .result:hover, .result.active { background: var(--accent-soft); }
  .result .rnm { font-weight: 500; font-size: 13.5px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result .rgroups { display: flex; gap: 4px; }
  .result .rgroups i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  #noresult { padding: 12px 15px; color: var(--muted); font-size: 13px; }

  #topbar .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--field);
    border: none; border-radius: 999px;
    padding: 9px 16px;
    font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.icon { width: 38px; height: 38px; padding: 0; color: var(--muted); }

  #menuwrap { position: relative; }
  #menu {
    position: absolute; right: 0; top: calc(100% + 12px);
    background: var(--glass-strong);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow-lg);
    min-width: 220px; overflow: hidden; z-index: 40;
    padding: 5px;
  }
  #menu button {
    display: block; width: 100%; text-align: left;
    background: none; border: none; border-radius: 11px;
    padding: 10px 13px;
    font-size: 13.5px; font-weight: 500; cursor: pointer;
  }
  #menu button:hover { background: var(--accent-soft); }
  #menu button.danger { color: var(--danger); }
  #menu hr { border: none; border-top: 1px solid var(--line); margin: 5px 8px; }

  /* ---------- legend ---------- */
  #legend {
    position: fixed; left: 12px; bottom: calc(var(--sab) + 12px); z-index: 25;
    display: flex; flex-direction: column; gap: 6px;
    max-width: 280px;
  }
  #legend .ltitle {
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    color: var(--faint); padding-left: 8px; text-transform: capitalize;
  }
  .lgroup {
    display: flex; align-items: center; gap: 8px;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 999px;
    box-shadow: var(--shadow);
    padding: 7px 14px 7px 10px;
    font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    transition: box-shadow .2s;
    width: fit-content;
  }
  .lgroup:hover { box-shadow: var(--shadow-lg); }
  .lgroup.on { box-shadow: inset 0 0 0 1.5px var(--accent), var(--shadow); background: var(--accent-soft); }
  .lgroup i { width: 9px; height: 9px; border-radius: 50%; display: block; flex: none; }
  .lgroup .cnt { color: var(--faint); font-size: 11px; font-weight: 600; }

  /* ---------- zoom ---------- */
  #zoomctl {
    position: fixed; right: 12px; bottom: calc(var(--sab) + 12px); z-index: 25;
    display: flex; flex-direction: column;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 999px;
    box-shadow: var(--shadow);
    overflow: hidden; padding: 4px;
  }
  #zoomctl button {
    background: none; border: none; border-radius: 50%;
    width: 38px; height: 38px; cursor: pointer; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  #zoomctl button:hover { background: var(--accent-soft); color: var(--text); }

  /* ---------- side panel: glass sheet ---------- */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(380px, 100vw);
    background: var(--glass-strong);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border-left: 1px solid var(--line);
    border-radius: 24px 0 0 24px;
    box-shadow: var(--shadow-lg);
    z-index: 35;
    display: flex; flex-direction: column;
  }
  #panel .phead {
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--sat) + 16px) 18px 10px;
  }
  #panel .phead .ptag {
    font-size: 12px; font-weight: 600; color: var(--muted); flex: 1;
    display: flex; align-items: center; gap: 7px;
    min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #pclose {
    background: var(--field); border: none; cursor: pointer; color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #pclose:hover { color: var(--text); }
  #panel .pbody { flex: 1; overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 16px; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--muted); margin-bottom: 6px; padding-left: 4px;
  }
  .field input[type=text], .field select, .field textarea {
    width: 100%;
    background: var(--field);
    border: none; border-radius: 12px;
    padding: 11px 13px; font-size: 14px;
  }
  .field textarea { min-height: 200px; resize: vertical; line-height: 1.6; }
  #pname { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; border-radius: 999px;
    background: var(--field);
    padding: 6px 13px 6px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer;
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .chip.on { box-shadow: inset 0 0 0 1.5px currentColor; font-weight: 600; }
  .chip.newg { color: var(--accent); background: var(--accent-soft); }
  .chip .unlink {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: none; padding: 0; margin-left: 2px;
    color: var(--faint); cursor: pointer;
  }
  .chip .unlink:hover { color: var(--danger); }
  .chip .unlink .ic { width: 11px; height: 11px; }

  .composer { display: flex; flex-direction: column; gap: 8px; }
  .composer textarea { min-height: 72px; }
  .composer .btn { align-self: flex-end; padding: 7px 14px; background: var(--accent-soft); color: var(--accent); }
  #entries { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .entry {
    border-radius: 14px;
    background: var(--field); padding: 10px 13px 11px; position: relative;
  }
  .entry .edate {
    font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--faint); margin-bottom: 4px;
  }
  .entry .edel {
    position: absolute; top: 6px; right: 6px;
    border: none; background: none; padding: 4px; cursor: pointer;
    color: var(--faint); opacity: 0; transition: opacity .15s;
    display: flex;
  }
  .entry:hover .edel, .entry .edel:focus-visible { opacity: 1; }
  .entry .edel:hover { color: var(--danger); }
  .entry .edel .ic { width: 12px; height: 12px; }
  .entry .etext { font-size: 13.5px; line-height: 1.55; white-space: pre-line; cursor: text; }
  .entry textarea {
    width: 100%; background: var(--card); border: none; border-radius: 12px;
    box-shadow: var(--focus);
    padding: 9px 11px; font-size: 13.5px; line-height: 1.55; min-height: 72px; resize: vertical;
  }

  #linkpicker { position: relative; margin-top: 8px; }
  #linkpicker input {
    width: 100%; background: var(--field); border: none; border-radius: 12px;
    padding: 10px 13px; font-size: 13.5px;
  }
  #linksugg {
    border-radius: 14px; margin-top: 6px;
    background: var(--card); box-shadow: var(--shadow);
    overflow: hidden;
  }
  #linksugg button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 10px 13px; font-size: 13px; cursor: pointer;
  }
  #linksugg button:last-child { border-bottom: none; }
  #linksugg button:hover { background: var(--accent-soft); }

  .grow { display: flex; align-items: center; gap: 8px; }
  .grow input[type=color] {
    width: 32px; height: 32px; padding: 3px; border: none; border-radius: 10px;
    background: var(--field); cursor: pointer; flex: none;
  }
  .grow input[type=text] {
    flex: 1; background: var(--field); border: none; border-radius: 10px;
    padding: 8px 12px; font-size: 13.5px; min-width: 0;
  }
  .grow .cnt {
    font-size: 11px; font-weight: 600; color: var(--faint); flex: none; width: 20px; text-align: right;
  }
  .grow .gdel {
    border: none; border-radius: 50%; background: var(--field);
    width: 32px; height: 32px; cursor: pointer; color: var(--muted); flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .grow .gdel:hover { color: var(--danger); }
  .pmeta { font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--faint); padding-left: 4px; }
  #panel .pfoot { padding: 12px 18px calc(var(--sab) + 14px); border-top: 1px solid var(--line); display: flex; gap: 8px; }
  #panel .pfoot .btn { flex: 1; background: var(--field); }

  /* ---------- modals ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(12, 15, 22, .42);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--glass-strong);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow-lg);
    width: min(440px, 100%);
    max-height: 88vh; overflow-y: auto;
    padding: 22px;
    display: flex; flex-direction: column; gap: 15px;
  }
  .modal h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .modal .mtag {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent);
  }
  .mrow { display: flex; gap: 8px; justify-content: flex-end; }
  .modal textarea {
    width: 100%; background: var(--field); border: none; border-radius: 12px;
    padding: 11px 13px; min-height: 140px;
    font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', monospace; font-size: 11.5px;
  }

  /* ---------- backup nudge (drops in under the top bar) ---------- */
  #backupNudge {
    position: fixed; left: 50%; top: calc(var(--sat) + 76px); z-index: 40;
    transform: translate(-50%, 0);
    width: min(400px, calc(100% - 24px));
    background: var(--glass-strong);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow-lg);
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; gap: 9px;
    animation: nudgeIn .5s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes nudgeIn { from { opacity: 0; transform: translate(-50%, -14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #backupNudge .ntitle { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  #backupNudge .ntitle .ic { width: 17px; height: 17px; color: var(--accent); }
  #backupNudge .nbody { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  #backupNudge .mrow .btn { padding: 7px 14px; }
  #backupNudge .mrow .btn:not(.primary) { background: var(--field); }

  /* ---------- resurface ---------- */
  .rsquote { font-size: 16px; line-height: 1.65; white-space: pre-line; }
  .rsmeta {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 500; color: var(--muted);
  }

  /* ---------- monthly wrap: aurora scene, no boxes ---------- */
  #wrap {
    position: fixed; inset: 0; z-index: 120;
    background: #04060d; overflow: hidden;
    cursor: pointer; user-select: none;
    color: #eef2f8;
  }
  #wrap .stars {
    position: absolute; inset: 0; opacity: .8;
    background-image:
      radial-gradient(1px 1px at 22px 34px, rgba(255,255,255,.9), transparent),
      radial-gradient(1px 1px at 180px 90px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 320px 150px, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 460px 40px, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 90px 210px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 540px 250px, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 250px 300px, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 410px 340px, rgba(255,255,255,.8), transparent);
    background-size: 620px 380px;
  }
  #wrap .aur {
    position: absolute; width: 150%; height: 55%;
    filter: blur(70px); border-radius: 50%;
    pointer-events: none;
  }
  #wrap .aur.a1 {
    background: linear-gradient(105deg, transparent 12%, #23d5ab 38%, #58a6ff 62%, transparent 88%);
    top: -14%; left: -25%; opacity: .5; transform: rotate(-10deg);
    animation: wdrift1 16s ease-in-out infinite alternate;
  }
  #wrap .aur.a2 {
    background: linear-gradient(80deg, transparent 10%, #7c5ce0 40%, #23d5ab 72%, transparent 92%);
    top: 4%; right: -32%; opacity: .38; transform: rotate(7deg);
    animation: wdrift2 21s ease-in-out infinite alternate;
  }
  #wrap .aur.a3 {
    background: linear-gradient(95deg, transparent 15%, #58a6ff 50%, transparent 85%);
    bottom: 38%; left: -18%; opacity: .22; transform: rotate(-4deg);
    animation: wdrift3 26s ease-in-out infinite alternate;
  }
  @keyframes wdrift1 { to { transform: rotate(-3deg) translate(5%, 7%); } }
  @keyframes wdrift2 { to { transform: rotate(12deg) translate(-6%, 4%); } }
  @keyframes wdrift3 { to { transform: rotate(2deg) translate(7%, -5%); } }
  #wrap .wstep {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 28px; gap: 18px;
    animation: wfade .8s ease both;
  }
  @keyframes wfade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #wrap .aur { animation: none; }
    #wrap .wstep { animation: none; }
  }
  #wrap .wkick {
    font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: .38em; text-transform: uppercase;
    color: #57e6b4; padding-left: .38em;
  }
  #wrap .whero {
    font-size: clamp(44px, 9vw, 92px); font-weight: 700;
    letter-spacing: -0.03em; line-height: 1.04;
    background: linear-gradient(100deg, #9be8ff 5%, #57e6b4 45%, #b79cff 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-wrap: balance;
  }
  #wrap .wbig {
    font-size: clamp(26px, 5vw, 46px); font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.28; max-width: 840px; text-wrap: balance;
  }
  #wrap .wbig .num {
    font-weight: 700;
    background: linear-gradient(100deg, #9be8ff, #57e6b4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #wrap .wquote {
    font-size: clamp(20px, 3.6vw, 33px); font-weight: 400;
    line-height: 1.5; max-width: 780px; text-wrap: balance;
  }
  #wrap .wsub { font-size: 15px; color: rgba(238, 242, 248, .55); max-width: 600px; line-height: 1.6; }
  #wrap .whint {
    position: absolute; bottom: calc(var(--sab) + 22px); left: 0; right: 0; text-align: center;
    font-family: ui-monospace, 'SF Mono', 'IBM Plex Mono', monospace;

  /* ---------- constellation (cosmos) view ---------- */
  #cosmosbg {

<script>
(function () {
  'use strict';

  var STORE_KEY = 'datasets-app-v1';
  var GRID = 52;
  var TYPES = [
    ['person',  'i-user', 'Person'],
    ['book',    'i-book', 'Book'],
    ['movie',   'i-film', 'Movie'],
    ['video',   'i-video', 'Video'],
    ['podcast', 'i-mic', 'Podcast'],
    ['article', 'i-doc', 'Article'],
    ['event',   'i-cal', 'Event / talk'],
    ['course',  'i-cap', 'Course'],
    ['idea',    'i-bulb', 'Idea'],
    ['other',   'i-box', 'Other']
  ];
  var PALETTE = ['#e5484d', '#e8791d', '#c9a227', '#2fa36b', '#17a2a8',
                 '#3e7bfa', '#7c5ce0', '#c74fb6', '#9a6b4f', '#64748b'];

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function typeDef(t) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i][0] === t) return TYPES[i]; return TYPES[TYPES.length - 1]; }
  function typeLabel(t) { return typeDef(t)[2]; }
  function mkIcon(iconId, cls) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', cls || 'ic');
    svg.setAttribute('viewBox', '0 0 24 24');
    var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#' + iconId);
    svg.appendChild(use);
    return svg;
  }
  function typeIconEl(t) { return mkIcon(typeDef(t)[1]); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function el(id) { return document.getElementById(id); }

  /* ---------- state ---------- */
  var state = null;

  function nextPosition(i) {
    var angle = i * 2.39996323; // golden angle
    var r = 250 + 95 * Math.sqrt(i);
    return { x: Math.round(Math.cos(angle) * r), y: Math.round(Math.sin(angle) * r * 0.78) };
  }

  function seed() {
    var g1 = { id: uid(), name: 'Brand Week Florida 2026', color: PALETTE[0] };
    var samples = [
      ['Gary Vaynerchuk', 'person', 'Attention is the only currency. Spend more time studying where attention actually is than perfecting the creative.\n\nDay-trade attention: underpriced channels exist at every moment.', [g1.id]],
      ['Mel Robbins', 'person', 'The 5 Second Rule: count 5-4-3-2-1 and move before your brain kills the impulse.\n\nMotivation is garbage — you will never feel like it. Act first, feeling follows.', [g1.id]],
      ['Atomic Habits', 'book', 'You do not rise to the level of your goals, you fall to the level of your systems.\n\nMake it obvious, attractive, easy, satisfying. 1% better every day compounds.', []],
      ['Naval Ravikant', 'podcast', 'Seek wealth, not money or status. Wealth is assets that earn while you sleep.\n\nSpecific knowledge is found by pursuing your genuine curiosity.', []],
      ['The Godfather', 'movie', '“It’s not personal, it’s strictly business” — separate emotion from decision-making.\n\nKeep your friends close, but your enemies closer.', []]
    ];
    var ds = samples.map(function (s, i) {
      var p = nextPosition(i);
      return { id: uid(), name: s[0], type: s[1], notes: s[2], groups: s[3],
               x: p.x, y: p.y, createdAt: Date.now(), updatedAt: Date.now() };
    });
    return { meName: 'Burak Ekmen', datasets: ds, groups: [g1], view: null };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.datasets) && Array.isArray(s.groups)) return s;
      }
    } catch (e) { /* storage unavailable */ }
    return seed();
  }

  var saveTimer = null;
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    }, 250);
  }

  function groupById(id) {
    for (var i = 0; i < state.groups.length; i++) if (state.groups[i].id === id) return state.groups[i];
    return null;
  }
  function dsById(id) {
    for (var i = 0; i < state.datasets.length; i++) if (state.datasets[i].id === id) return state.datasets[i];
    return null;
  }
  function nextColor() {
    return PALETTE[state.groups.length % PALETTE.length];
  }
  function migrate(s) {
    s.datasets.forEach(function (d) {
      if (!Array.isArray(d.entries)) {
        d.entries = [];
        if (d.notes && String(d.notes).trim()) {
          d.entries.push({ id: uid(), text: String(d.notes).trim(), at: d.createdAt || Date.now() });
        }
        delete d.notes;
      }
      if (!Array.isArray(d.links)) d.links = [];
    });
    if (!s.firstOpenAt) s.firstOpenAt = Date.now();
    if (typeof s.lastBackupAt !== 'number') s.lastBackupAt = null;
    if (typeof s.backupSnoozedUntil !== 'number') s.backupSnoozedUntil = 0;
    return s;
  }
  function entriesText(d) {
    return (d.entries || []).map(function (e) { return e.text; }).join('\n');
  }
  function latestEntry(d) {
    return (d.entries && d.entries.length) ? d.entries[d.entries.length - 1] : null;
  }
  function connectionsOf(d) {
    var ids = {};
    (d.links || []).forEach(function (id) { ids[id] = true; });
    state.datasets.forEach(function (o) {
      if (o.id !== d.id && (o.links || []).indexOf(d.id) !== -1) ids[o.id] = true;
    });
    return Object.keys(ids).map(dsById).filter(Boolean);
  }
  function unlink(a, b) {
    a.links = (a.links || []).filter(function (id) { return id !== b.id; });
    b.links = (b.links || []).filter(function (id) { return id !== a.id; });
  }
  function createGroup(name) {
    var g = { id: uid(), name: name, color: nextColor() };
    state.groups.push(g);
    persist();
    return g;
  }

  /* ---------- view (pan/zoom) ---------- */
  var canvas = el('canvas'), world = el('world'), wiresSvg = el('wires'), nodesDiv = el('nodes');
  function topH() { return 0; } // canvas is full-bleed; the glass bar floats above it
  var view = { x: window.innerWidth / 2, y: (window.innerHeight - topH()) / 2, z: 1 };

  function applyView() {
    world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.z + ')';
    var s = GRID * view.z;
    canvas.style.backgroundSize = s + 'px ' + s + 'px';
    canvas.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
    state.view = { x: view.x, y: view.y, z: view.z };
    try { sessionStorage.setItem('datasets-session-view', JSON.stringify(state.view)); } catch (e) { /* ignore */ }
    persist();
    if (typeof checkCosmos === 'function') checkCosmos();
  }
  function screenToWorld(sx, sy) {
    return { x: (sx - view.x) / view.z, y: (sy - topH() - view.y) / view.z };
  }
  function zoomAt(sx, sy, factor) {
    sy = sy - topH();
    var nz = clamp(view.z * factor, 0.22, 2.6);
    factor = nz / view.z;
    view.x = sx - (sx - view.x) * factor;
    view.y = sy - (sy - view.y) * factor;
    view.z = nz;
    applyView();
  }

  var animFrame = null;
  function animateView(target, ms, done) {
    cancelAnimationFrame(animFrame);
    if (reduced) ms = 0;
    var from = { x: view.x, y: view.y, z: view.z };
    var t0 = performance.now();
    function step(t) {
      var p = ms === 0 ? 1 : clamp((t - t0) / ms, 0, 1);
      var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      view.x = from.x + (target.x - from.x) * e;
      view.y = from.y + (target.y - from.y) * e;
      view.z = from.z + (target.z - from.z) * e;
      applyView();
      if (p < 1) animFrame = requestAnimationFrame(step);
      else if (done) done();
    }
    animFrame = requestAnimationFrame(step);
  }

  function viewH() { return window.innerHeight - topH(); }

  function fitTarget() {
    var minX = -160, maxX = 160, minY = -80, maxY = 80;
    var rendered = nodesDiv.querySelectorAll('.node');
    if (rendered.length) {
      rendered.forEach(function (n) {
        var x = parseFloat(n.style.left) || 0, y = parseFloat(n.style.top) || 0;
        var hw = n.offsetWidth / 2 + 24, hh = n.offsetHeight / 2 + 24;
        minX = Math.min(minX, x - hw); maxX = Math.max(maxX, x + hw);
        minY = Math.min(minY, y - hh); maxY = Math.max(maxY, y + hh);
      });
    } else state.datasets.forEach(function (d) {
      minX = Math.min(minX, d.x - 120); maxX = Math.max(maxX, d.x + 120);
      minY = Math.min(minY, d.y - 70);  maxY = Math.max(maxY, d.y + 70);
    });
    var w = maxX - minX, h = maxY - minY;
    var z = clamp(Math.min(window.innerWidth / w, viewH() / h) * 0.9, 0.22, 1.3);
    return {
      x: window.innerWidth / 2 - (minX + w / 2) * z,
      y: viewH() / 2 - (minY + h / 2) * z,
      z: z
    };
  }
  function fitView() { animateView(fitTarget(), 500); }

  /* ---------- render ---------- */
  var nodeEls = {}, wireEls = {}, linkEls = {};
  var activeFilter = null;

  function wirePath(d) {
    var mx = d.x / 2 - d.y * 0.10, my = d.y / 2 + d.x * 0.10;
    return 'M 0 0 Q ' + mx + ' ' + my + ' ' + d.x + ' ' + d.y;
  }
  function linkPath(a, b) {
    var mx = (a.x + b.x) / 2 + (b.y - a.y) * 0.08;
    var my = (a.y + b.y) / 2 - (b.x - a.x) * 0.08;
    return 'M ' + a.x + ' ' + a.y + ' Q ' + mx + ' ' + my + ' ' + b.x + ' ' + b.y;
  }
  function isDim(d) { return activeFilter && d.groups.indexOf(activeFilter) === -1; }

  function buildNode(d) {
    var n = document.createElement('div');
    n.className = 'node';
    n.dataset.id = d.id;

    var strip = document.createElement('div');
    strip.className = 'strip';
    var gcolors = d.groups.map(function (gid) { var g = groupById(gid); return g ? g.color : null; })
                          .filter(Boolean);
    if (gcolors.length === 1) strip.style.background = gcolors[0];
    else if (gcolors.length > 1) {
      var stops = [], seg = 100 / gcolors.length;
      gcolors.forEach(function (c, i) { stops.push(c + ' ' + (i * seg) + '% ' + ((i + 1) * seg) + '%'); });
      strip.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
    }
    n.appendChild(strip);

    var inner = document.createElement('div');
    inner.className = 'inner';
    var kind = document.createElement('div');
    kind.className = 'kind';
    kind.appendChild(typeIconEl(d.type));
    var kt = document.createElement('span');
    kt.className = 't';
    kt.textContent = typeLabel(d.type);
    kind.appendChild(kt);
    inner.appendChild(kind);
    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = d.name;
    inner.appendChild(nm);
    var le = latestEntry(d);
    var firstLine = le ? le.text.trim().split('\n')[0] : '';
    if (firstLine) {
      var pv = document.createElement('div');
      pv.className = 'prev';
      pv.textContent = firstLine;
      inner.appendChild(pv);
    }
    if (gcolors.length) {
      var dots = document.createElement('div');
      dots.className = 'dots';
      gcolors.forEach(function (c) {
        var i = document.createElement('i');
        i.style.background = c;
        dots.appendChild(i);
      });
      inner.appendChild(dots);
    }
    n.appendChild(inner);
    n.style.left = d.x + 'px';
    n.style.top = d.y + 'px';
    if (activeFilter && d.groups.indexOf(activeFilter) === -1) n.classList.add('dimmed');
    return n;
  }

  function render() {
    nodesDiv.textContent = '';
    wiresSvg.textContent = '';
    nodeEls = {}; wireEls = {}; linkEls = {};

    state.datasets.forEach(function (d) {
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', wirePath(d));
      var gc = null;
      for (var i = 0; i < d.groups.length; i++) {
        var g = groupById(d.groups[i]);
        if (g) { gc = g.color; break; }
      }
      p.setAttribute('stroke', gc || 'var(--wire)');
      if (activeFilter && d.groups.indexOf(activeFilter) === -1) p.classList.add('dimmed');
      wiresSvg.appendChild(p);
      wireEls[d.id] = p;
    });

    // dataset-to-dataset connections: dashed, undirected, drawn once per pair
    state.datasets.forEach(function (a) {
      (a.links || []).forEach(function (oid) {
        var b = dsById(oid);
        if (!b) return;
        var key = a.id < oid ? a.id + '|' + oid : oid + '|' + a.id;
        if (linkEls[key]) return;
        var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', linkPath(a, b));
        p.setAttribute('stroke', 'var(--wire)');
        p.setAttribute('stroke-dasharray', '4 4');
        if (isDim(a) || isDim(b)) p.classList.add('dimmed');
        wiresSvg.appendChild(p);
        linkEls[key] = p;
      });
    });

    var me = document.createElement('div');
    me.className = 'node me';
    me.dataset.me = '1';
    var meInner = document.createElement('div');
    meInner.className = 'inner';
    var meKind = document.createElement('div');
    meKind.className = 'kind';
    meKind.textContent = 'Datasets of';
    meInner.appendChild(meKind);
    var meNm = document.createElement('div');
    meNm.className = 'nm';
    meNm.textContent = state.meName;
    meInner.appendChild(meNm);
    me.appendChild(meInner);
    me.style.left = '0px';
    me.style.top = '0px';
    me.title = 'Click to rename';
    nodesDiv.appendChild(me);

    state.datasets.forEach(function (d) {
      var n = buildNode(d);
      nodesDiv.appendChild(n);
      nodeEls[d.id] = n;
    });

    renderLegend();
    el('hintbubble') && el('hintbubble').remove();
    if (state.datasets.length === 0) {
      var hb = document.createElement('div');
      hb.id = 'hintbubble';
      hb.textContent = 'Your graph is empty — press “Add dataset” to wire in your first source.';
      document.body.appendChild(hb);
    }
  }

  function renderLegend() {
    var lg = el('legend');
    lg.textContent = '';
    if (!state.groups.length) return;
    var t = document.createElement('div');
    t.className = 'ltitle';
    t.textContent = 'groups';
    lg.appendChild(t);
    state.groups.forEach(function (g) {
      var cnt = state.datasets.filter(function (d) { return d.groups.indexOf(g.id) !== -1; }).length;
      var b = document.createElement('button');
      b.className = 'lgroup' + (activeFilter === g.id ? ' on' : '');
      b.type = 'button';
      var i = document.createElement('i');
      i.style.background = g.color;
      b.appendChild(i);
      b.appendChild(document.createTextNode(g.name + ' '));
      var c = document.createElement('span');
      c.className = 'cnt';
      c.textContent = String(cnt);
      b.appendChild(c);
      b.addEventListener('click', function () {
        activeFilter = (activeFilter === g.id) ? null : g.id;
        render();
      });
      lg.appendChild(b);
    });
  }

  /* ---------- pointer: pan, drag, click, pinch ---------- */
  var pointer = null;
  var touches = {};
  var touchCount = 0;
  var pinching = false;

  function touchList() {
    var out = [];
    for (var k in touches) out.push(touches[k]);
    return out;
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    touches[e.pointerId] = { x: e.clientX, y: e.clientY };
    touchCount++;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic or stale pointer */ }

    if (touchCount === 2) {
      if (pointer && pointer.node && pointer.moved) { pointer.node.updatedAt = Date.now(); persist(); }
      pointer = null;
      pinching = true;
      canvas.classList.add('panning');
      return;
    }
    if (touchCount > 2 || pinching) return;

    var nodeEl = e.target.closest('.node');
    pointer = {
      id: e.pointerId,
      sx: e.clientX, sy: e.clientY,
      moved: false,
      node: nodeEl && !nodeEl.dataset.me ? dsById(nodeEl.dataset.id) : null,
      me: nodeEl && nodeEl.dataset.me ? true : false,
      startView: { x: view.x, y: view.y },
      startNode: null
    };
    if (pointer.node) pointer.startNode = { x: pointer.node.x, y: pointer.node.y };
    if (!nodeEl) canvas.classList.add('panning');
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!(e.pointerId in touches)) return;

    if (pinching) {
      var prev = touchList();
      touches[e.pointerId] = { x: e.clientX, y: e.clientY };
      var cur = touchList();
      if (cur.length >= 2) {
        var pm = { x: (prev[0].x + prev[1].x) / 2, y: (prev[0].y + prev[1].y) / 2 };
        var cm = { x: (cur[0].x + cur[1].x) / 2, y: (cur[0].y + cur[1].y) / 2 };
        var pd = Math.hypot(prev[0].x - prev[1].x, prev[0].y - prev[1].y) || 1;
        var cd = Math.hypot(cur[0].x - cur[1].x, cur[0].y - cur[1].y) || 1;
        view.x += cm.x - pm.x;
        view.y += cm.y - pm.y;
        zoomAt(cm.x, cm.y, cd / pd);
      }
      return;
    }

    touches[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (!pointer || e.pointerId !== pointer.id) return;
    var dx = e.clientX - pointer.sx, dy = e.clientY - pointer.sy;
    if (!pointer.moved && Math.abs(dx) + Math.abs(dy) > 4) pointer.moved = true;
    if (!pointer.moved) return;
    if (pointer.node) {
      pointer.node.x = pointer.startNode.x + dx / view.z;
      pointer.node.y = pointer.startNode.y + dy / view.z;
      var n = nodeEls[pointer.node.id];
      if (n) { n.style.left = pointer.node.x + 'px'; n.style.top = pointer.node.y + 'px'; }
      var w = wireEls[pointer.node.id];
      if (w) w.setAttribute('d', wirePath(pointer.node));
      var nid = pointer.node.id;
      for (var key in linkEls) {
        var ids = key.split('|');
        if (ids[0] === nid || ids[1] === nid) {
          var a2 = dsById(ids[0]), b2 = dsById(ids[1]);
          if (a2 && b2) linkEls[key].setAttribute('d', linkPath(a2, b2));
        }
      }
    } else if (!pointer.me) {
      view.x = pointer.startView.x + dx;
      view.y = pointer.startView.y + dy;
      applyView();
    }
  });

  function endPointer(e) {
    if (e.pointerId in touches) {
      delete touches[e.pointerId];
      touchCount = Math.max(0, touchCount - 1);
    }
    if (pinching) {
      if (touchCount < 2) {
        pinching = false;
        canvas.classList.remove('panning');
      }
      return;
    }
    if (!pointer || e.pointerId !== pointer.id) return;
    canvas.classList.remove('panning');
    if (!pointer.moved) {
      if (pointer.node) openPanel(pointer.node.id);
      else if (pointer.me) renameMe();
      else { closePanel(); closeMenu(); hideResults(); }
    } else if (pointer.node) {
      pointer.node.updatedAt = Date.now();
      persist();
    }
    pointer = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var factor = Math.pow(1.0015, -e.deltaY);
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive: false });

  canvas.addEventListener('dblclick', function (e) {
    if (e.target.closest('.node')) return;
    var w = screenToWorld(e.clientX, e.clientY);
    openAddModal(w);
  });

  el('zIn').addEventListener('click', function () { zoomAt(window.innerWidth / 2, topH() + viewH() / 2, 1.25); });
  el('zOut').addEventListener('click', function () { zoomAt(window.innerWidth / 2, topH() + viewH() / 2, 0.8); });
  el('zFit').addEventListener('click', fitView);
  el('mFit').addEventListener('click', function () { closeMenu(); fitView(); });

  /* ---------- side panel ---------- */
  var panelId = null;
  var panel = el('panel');

  function fillTypeSelect(sel) {
    sel.textContent = '';
    TYPES.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t[0];
      o.textContent = t[2];
      sel.appendChild(o);
    });
  }
  fillTypeSelect(el('ptype'));
  fillTypeSelect(el('atype'));

  function setPtag(d) {
    var tag = el('ptag');
    tag.textContent = '';
    tag.appendChild(typeIconEl(d.type));
    tag.appendChild(document.createTextNode('Dataset — ' + typeLabel(d.type)));
  }

  function renderChips(container, selected, onToggle) {
    container.textContent = '';
    state.groups.forEach(function (g) {
      var on = selected.indexOf(g.id) !== -1;
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip' + (on ? ' on' : '');
      if (on) c.style.color = g.color;
      var i = document.createElement('i');
      i.style.background = g.color;
      c.appendChild(i);
      c.appendChild(document.createTextNode(g.name));
      c.addEventListener('click', function () { onToggle(g.id); });
      container.appendChild(c);
    });
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'chip newg';
    add.textContent = '+ New group';
    add.addEventListener('click', function () {
      promptModal('new group', 'Name this group', '', function (name) {
        if (!name.trim()) return;
        var g = createGroup(name.trim());
        onToggle(g.id);
      });
    });
    container.appendChild(add);
  }

  function fmtDate(ts) {
    return new Date(ts).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function renderEntries(d) {
    var wrap = el('entries');
    wrap.textContent = '';
    var list = (d.entries || []).slice().reverse(); // newest first
    list.forEach(function (entry) {
      var box = document.createElement('div');
      box.className = 'entry';
      var date = document.createElement('div');
      date.className = 'edate';
      date.textContent = fmtDate(entry.at);
      box.appendChild(date);
      var del = document.createElement('button');
      del.className = 'edel';
      del.setAttribute('aria-label', 'Delete entry');
      del.appendChild(mkIcon('i-close'));
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!confirm('Delete this entry?')) return;
        d.entries = d.entries.filter(function (x) { return x.id !== entry.id; });
        d.updatedAt = Date.now();
        persist(); render(); renderEntries(d);
      });
      box.appendChild(del);
      var text = document.createElement('div');
      text.className = 'etext';
      text.textContent = entry.text;
      text.addEventListener('click', function () {
        var ta = document.createElement('textarea');
        ta.value = entry.text;
        box.replaceChild(ta, text);
        ta.focus();
        ta.addEventListener('blur', function () {
          var v = ta.value.trim();
          if (!v) {
            d.entries = d.entries.filter(function (x) { return x.id !== entry.id; });
          } else {
            entry.text = v;
          }
          d.updatedAt = Date.now();
          persist(); render(); renderEntries(d);
        });
      });
      box.appendChild(text);
      wrap.appendChild(box);
    });
  }

  function renderLinksUI(d) {
    var wrap = el('plinks');
    wrap.textContent = '';
    connectionsOf(d).forEach(function (o) {
      var c = document.createElement('span');
      c.className = 'chip';
      c.style.cursor = 'pointer';
      var nameSpan = document.createElement('span');
      nameSpan.textContent = o.name;
      nameSpan.addEventListener('click', function () { focusNode(o.id); });
      c.appendChild(nameSpan);
      var un = document.createElement('button');
      un.className = 'unlink';
      un.setAttribute('aria-label', 'Remove connection');
      un.appendChild(mkIcon('i-close'));
      un.addEventListener('click', function (ev) {
        ev.stopPropagation();
        unlink(d, o);
        d.updatedAt = Date.now();
        persist(); render(); renderLinksUI(d);
      });
      c.appendChild(un);
      wrap.appendChild(c);
    });
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'chip newg';
    add.textContent = '+ Link dataset';
    add.addEventListener('click', function () {
      var lp = el('linkpicker');
      lp.hidden = !lp.hidden;
      if (!lp.hidden) { el('linksearch').value = ''; el('linksugg').hidden = true; el('linksearch').focus(); }
    });
    wrap.appendChild(add);
  }

  el('linksearch').addEventListener('input', function () {
    var d = dsById(panelId);
    if (!d) return;
    var q = this.value.trim().toLowerCase();
    var sugg = el('linksugg');
    sugg.textContent = '';
    if (!q) { sugg.hidden = true; return; }
    var connected = {};
    connectionsOf(d).forEach(function (o) { connected[o.id] = true; });
    var matches = state.datasets.filter(function (o) {
      return o.id !== d.id && !connected[o.id] && o.name.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 5);
    if (!matches.length) { sugg.hidden = true; return; }
    matches.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.appendChild(typeIconEl(o.type));
      b.appendChild(document.createTextNode(o.name));
      b.addEventListener('click', function () {
        d.links = d.links || [];
        d.links.push(o.id);
        d.updatedAt = Date.now();
        el('linkpicker').hidden = true;
        persist(); render(); renderLinksUI(d);
      });
      sugg.appendChild(b);
    });
    sugg.hidden = false;
  });

  function openPanel(id) {
    var d = dsById(id);
    if (!d) return;
    panelId = id;
    panel.hidden = false;
    setPtag(d);
    el('pname').value = d.name;
    el('ptype').value = d.type;
    el('newEntry').value = '';
    el('linkpicker').hidden = true;
    renderEntries(d);
    renderLinksUI(d);
    var created = new Date(d.createdAt);
    el('pmeta').textContent = 'added ' + created.toLocaleDateString() +
      ' · updated ' + new Date(d.updatedAt).toLocaleDateString();
    function toggleGroup(gid) {
      var idx = d.groups.indexOf(gid);
      if (idx === -1) d.groups.push(gid); else d.groups.splice(idx, 1);
      d.updatedAt = Date.now();
      persist();
      render();
      renderChips(el('pchips'), d.groups, toggleGroup);
    }
    renderChips(el('pchips'), d.groups, toggleGroup);

  /* ---------- resurface: lesson of the day ---------- */
  var rsDatasetId = null;

  function pickResurface() {
    var pool = [];
    state.datasets.forEach(function (d) {
      (d.entries || []).forEach(function (e) { pool.push({ d: d, e: e }); });
    });
    if (!pool.length) return null;
    // least-recently-resurfaced first (never-shown wins), then take one of the
    // stalest third at random so it doesn't become a fixed rotation
    pool.sort(function (a, b) { return (a.e.seenAt || 0) - (b.e.seenAt || 0); });
    var cut = pool.slice(0, Math.max(1, Math.ceil(pool.length * 0.34)));
    return cut[Math.floor(Math.random() * cut.length)];
  }

  function showResurface() {
    var pick = pickResurface();
    if (!pick) return false;
    pick.e.seenAt = Date.now();
    pick.e.seenCount = (pick.e.seenCount || 0) + 1;
    persist();
    rsDatasetId = pick.d.id;
    el('rsQuote').textContent = pick.e.text;
    var meta = el('rsMeta');
    meta.textContent = '';
    meta.appendChild(typeIconEl(pick.d.type));
    meta.appendChild(document.createTextNode(pick.d.name + ' · captured ' + fmtDate(pick.e.at)));

    return true;
  }

  /* ---------- monthly wrap ---------- */
  function monthKeyOf(y, m) { return y + '-' + ('0' + (m + 1)).slice(-2); }

  function monthStats(y, m) {
    var start = new Date(y, m, 1).getTime();
    var end = new Date(y, m + 1, 1).getTime();
    var entryCount = 0, sources = {}, groupCounts = {}, longest = null;
    var newDatasets = 0;
    state.datasets.forEach(function (d) {
      if (d.createdAt >= start && d.createdAt < end) newDatasets++;
      (d.entries || []).forEach(function (e) {
        if (e.at < start || e.at >= end) return;
        entryCount++;
        sources[d.id] = (sources[d.id] || 0) + 1;
        d.groups.forEach(function (gid) { groupCounts[gid] = (groupCounts[gid] || 0) + 1; });
        if (!longest || e.text.length > longest.e.text.length) longest = { d: d, e: e };
      });
    });
    var topSource = null, topSourceN = 0;
    Object.keys(sources).forEach(function (id) {
      if (sources[id] > topSourceN) { topSourceN = sources[id]; topSource = dsById(id); }
    });
    var topGroup = null, topGroupN = 0;
    Object.keys(groupCounts).forEach(function (gid) {
      if (groupCounts[gid] > topGroupN) { topGroupN = groupCounts[gid]; topGroup = groupById(gid); }
    });
    return {
      entryCount: entryCount, sourceCount: Object.keys(sources).length, newDatasets: newDatasets,
      topSource: topSource, topSourceN: topSourceN,
      topGroup: topGroup, topGroupN: topGroupN,
      longest: longest
    };
  }

  var wrapSteps = [], wrapIdx = 0;

  function wEl(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  function buildWrapSteps(y, m, s) {
    var monthName = new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long' });
    var steps = [];

    steps.push(function (step) {
      step.appendChild(wEl('div', 'wkick', 'your month in datasets'));
      step.appendChild(wEl('div', 'whero', monthName + ' ' + y));
      step.appendChild(wEl('div', 'wsub', 'What you wired into your graph, before it could slip away.'));
    });

    steps.push(function (step) {
      step.appendChild(wEl('div', 'wkick', 'captured'));
      var big = wEl('div', 'wbig');
      var n1 = wEl('span', 'num', String(s.entryCount));
      var n2 = wEl('span', 'num', String(s.sourceCount));
      big.appendChild(n1);
      big.appendChild(document.createTextNode(' lesson' + (s.entryCount === 1 ? '' : 's') + ' from '));
      big.appendChild(n2);
      big.appendChild(document.createTextNode(' source' + (s.sourceCount === 1 ? '' : 's') + '.'));
      step.appendChild(big);
      if (s.newDatasets) step.appendChild(wEl('div', 'wsub', s.newDatasets + ' of those source' + (s.newDatasets === 1 ? ' is' : 's are') + ' new to your graph.'));
    });

    if (s.topSource) {
      steps.push(function (step) {
        step.appendChild(wEl('div', 'wkick', 'your most fed source'));
        step.appendChild(wEl('div', 'whero', s.topSource.name));
        step.appendChild(wEl('div', 'wsub', s.topSourceN + ' lesson' + (s.topSourceN === 1 ? '' : 's') + ' this month — this is who your mind kept returning to.'));
      });
    }

    if (s.topGroup) {
      steps.push(function (step) {
        step.appendChild(wEl('div', 'wkick', 'where it wired together'));
        var hero = wEl('div', 'whero', s.topGroup.name);
        step.appendChild(hero);
        step.appendChild(wEl('div', 'wsub', s.topGroupN + ' lesson' + (s.topGroupN === 1 ? '' : 's') + ' joined this thread of your graph.'));
      });
    }

    if (s.longest) {
      steps.push(function (step) {
        step.appendChild(wEl('div', 'wkick', 'one worth re-reading'));
        var q = s.longest.e.text.trim().split('\n')[0];
        if (q.length > 180) q = q.slice(0, 177) + '…';
        step.appendChild(wEl('div', 'wquote', '“' + q + '”'));
        step.appendChild(wEl('div', 'wsub', '— ' + s.longest.d.name));
      });
    }

    steps.push(function (step) {
      step.appendChild(wEl('div', 'wkick', 'that’s a wrap'));
      step.appendChild(wEl('div', 'whero', 'Keep feeding the graph.'));
      step.appendChild(wEl('div', 'wsub', 'Every lesson you capture here is one that doesn’t fade. See you next month.'));
    });

    return steps;
  }

  function showWrapStep() {
    var host = el('wsteps');
    host.textContent = '';
    var step = wEl('div', 'wstep');
    wrapSteps[wrapIdx](step);
    host.appendChild(step);
  }

  function openWrap(y, m) {
    var s = monthStats(y, m);
    if (!s.entryCount) return false;
    wrapSteps = buildWrapSteps(y, m, s);
    wrapIdx = 0;
    el('wrap').hidden = false;
    showWrapStep();
    return true;
  }
  function closeWrap() { el('wrap').hidden = true; }

  el('wrap').addEventListener('click', function (e) {

    wrapIdx++;

    else showWrapStep();

  el('mWrap').addEventListener('click', function () {

    promptModal('monthly wrap', 'No lessons this month yet — your wrap builds as you capture.', '', function () {});

  /* ---------- constellation (cosmos) view ---------- */
  var cosmosOn = false, cosmosRaf = null;
  var cosmosCanvas = el('cosmosCanvas');
  var cctx = cosmosCanvas.getContext('2d');

  function hash01(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return (h % 1000) / 1000;
  }
  function firstGroupColor(d) {
    for (var i = 0; i < d.groups.length; i++) {
      var g = groupById(d.groups[i]);
      if (g) return g.color;
    }
    return null;
  }
  function resizeCosmos() {
    var dpr = window.devicePixelRatio || 1;
    cosmosCanvas.width = Math.round(window.innerWidth * dpr);
    cosmosCanvas.height = Math.round(viewH() * dpr);
  }

  function drawStar(x, y, radius, color, alpha) {
    var glow = cctx.createRadialGradient(x, y, 0, x, y, radius * 7);
    glow.addColorStop(0, color);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    cctx.globalAlpha = alpha * 0.35;
    cctx.fillStyle = glow;
    cctx.beginPath();
    cctx.arc(x, y, radius * 7, 0, 6.2832);
    cctx.fill();
    cctx.globalAlpha = alpha;
    cctx.fillStyle = '#f2f7ff';
    cctx.beginPath();
    cctx.arc(x, y, radius, 0, 6.2832);
    cctx.fill();
  }

  function drawCosmos(t) {
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = viewH();
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cctx.clearRect(0, 0, w, h);
    function px(wx, wy) { return { x: wx * view.z + view.x, y: wy * view.z + view.y }; }
    var c = px(0, 0);

    // spokes: faint constellation lines from the pole star
    cctx.lineWidth = 1;
    state.datasets.forEach(function (d) {
      var p = px(d.x, d.y);
      cctx.strokeStyle = firstGroupColor(d) || '#4a5f7a';
      cctx.globalAlpha = 0.26;
      cctx.beginPath();
      cctx.moveTo(c.x, c.y);
      cctx.lineTo(p.x, p.y);
      cctx.stroke();
    });

    // dataset-to-dataset links: dashed, fainter
    cctx.setLineDash([3, 6]);
    cctx.strokeStyle = '#5b6f88';
    cctx.globalAlpha = 0.28;
    var drawn = {};
    state.datasets.forEach(function (a) {
      (a.links || []).forEach(function (oid) {
        var b = dsById(oid);
        if (!b) return;
        var key = a.id < oid ? a.id + '|' + oid : oid + '|' + a.id;
        if (drawn[key]) return;
        drawn[key] = true;
        var pa = px(a.x, a.y), pb = px(b.x, b.y);
        cctx.beginPath();
        cctx.moveTo(pa.x, pa.y);
        cctx.lineTo(pb.x, pb.y);
        cctx.stroke();
      });
    });
    cctx.setLineDash([]);

    // source stars, tinted by group, gently twinkling
    cctx.font = '10px "IBM Plex Mono", ui-monospace, monospace';
    cctx.textAlign = 'center';
    state.datasets.forEach(function (d) {
      var p = px(d.x, d.y);
      var ph = hash01(d.id);
      var tw = reduced ? 1 : (0.78 + 0.22 * Math.sin(t / 900 + ph * 6.2832));
      drawStar(p.x, p.y, 2.6 + 1.4 * tw, firstGroupColor(d) || '#9fc6ff', 0.95 * tw);
      cctx.globalAlpha = 0.62;
      cctx.fillStyle = '#c8d6e8';
      cctx.fillText(d.name, p.x, p.y + 18);
    });

    // pole star: you, brighter, with a glint
    var ctw = reduced ? 1 : (0.85 + 0.15 * Math.sin(t / 1400));
    drawStar(c.x, c.y, 4.4 * ctw, '#9be8ff', 1);
    cctx.globalAlpha = 0.5 * ctw;
    cctx.strokeStyle = '#cfeaff';
    cctx.lineWidth = 1;
    cctx.beginPath();
    cctx.moveTo(c.x - 14, c.y); cctx.lineTo(c.x + 14, c.y);
    cctx.moveTo(c.x, c.y - 14); cctx.lineTo(c.x, c.y + 14);
    cctx.stroke();
    cctx.globalAlpha = 0.75;
    cctx.fillStyle = '#e8f2ff';
    cctx.font = '11px "IBM Plex Mono", ui-monospace, monospace';
    cctx.fillText(state.meName, c.x, c.y + 24);
    cctx.globalAlpha = 1;
  }

  function cosmosLoop(t) {
    drawCosmos(t || 0);
    cosmosRaf = requestAnimationFrame(cosmosLoop);
  }
  function setCosmos(on) {
    if (on === cosmosOn) return;
    cosmosOn = on;
    document.body.classList.toggle('cosmos', on);
    cancelAnimationFrame(cosmosRaf);
    if (on) {
      resizeCosmos();
      if (reduced) drawCosmos(0);
      else cosmosRaf = requestAnimationFrame(cosmosLoop);
    }
  }
  function checkCosmos() {
    // hysteresis so the crossfade doesn't flicker at the boundary
    setCosmos(view.z < (cosmosOn ? 0.42 : 0.36));
    if (cosmosOn && reduced) drawCosmos(0);
  }
  el('mCosmos').addEventListener('click', function () {
    closeMenu();
    closePanel();
    var minX = -160, maxX = 160, minY = -80, maxY = 80;
    state.datasets.forEach(function (d) {
      minX = Math.min(minX, d.x - 120); maxX = Math.max(maxX, d.x + 120);
      minY = Math.min(minY, d.y - 70);  maxY = Math.max(maxY, d.y + 70);
    });
    var w = maxX - minX, h = maxY - minY;
    var z = Math.min(clamp(Math.min(window.innerWidth / w, viewH() / h) * 0.9, 0.22, 1.3), 0.3);
    animateView({
      x: window.innerWidth / 2 - (minX + w / 2) * z,
      y: viewH() / 2 - (minY + h / 2) * z,
      z: z
    }, 900);
  });
  window.addEventListener('resize', function () { if (cosmosOn) { resizeCosmos(); drawCosmos(0); } });

  /* ---------- manage groups ---------- */
  function renderGroupRows() {
    var wrap = el('grows');
    wrap.textContent = '';
    if (!state.groups.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'font-size:12.5px;color:var(--muted)';
      empty.textContent = 'No groups yet.';
      wrap.appendChild(empty);
      return;
    }
    state.groups.forEach(function (g) {
      var row = document.createElement('div');
      row.className = 'grow';
      var color = document.createElement('input');
      color.type = 'color';
      color.value = g.color;
      color.setAttribute('aria-label', 'Group color');
      color.addEventListener('input', function () {
        g.color = this.value;
        persist(); render();
      });
      row.appendChild(color);
      var name = document.createElement('input');
      name.type = 'text';
      name.value = g.name;
      name.setAttribute('aria-label', 'Group name');
      name.addEventListener('input', function () {
        g.name = this.value;
        persist(); render();
      });
      row.appendChild(name);
      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      cnt.textContent = String(state.datasets.filter(function (d) { return d.groups.indexOf(g.id) !== -1; }).length);
      row.appendChild(cnt);
      var del = document.createElement('button');
      del.className = 'gdel';
      del.setAttribute('aria-label', 'Delete group');
      del.appendChild(mkIcon('i-close'));
      del.addEventListener('click', function () {
        if (!confirm('Delete group “' + g.name + '”? Its datasets stay, they just lose this tag.')) return;
        state.groups = state.groups.filter(function (x) { return x.id !== g.id; });
        state.datasets.forEach(function (d) {
          d.groups = d.groups.filter(function (gid) { return gid !== g.id; });
        });
        if (activeFilter === g.id) activeFilter = null;
        persist(); render(); renderGroupRows();
      });
      row.appendChild(del);
      wrap.appendChild(row);
    });
  }
  el('mGroups').addEventListener('click', function () {
    closeMenu();
    renderGroupRows();
    el('groupsOverlay').hidden = false;
  });
  el('gAdd').addEventListener('click', function () {
    createGroup('New group');
    render();
    renderGroupRows();
  });
  el('gClose').addEventListener('click', function () {
    el('groupsOverlay').hidden = true;
    if (panelId) openPanel(panelId); // refresh panel chips with new names/colors
  });

  /* ---------- search ---------- */
  var searchInput = el('search'), resultsDiv = el('results');
  var activeResult = -1, currentMatches = [];

  function hideResults() { resultsDiv.hidden = true; activeResult = -1; }

  function focusNode(id, skipOpen) {
    var d = dsById(id);
    if (!d) return;
    var z = clamp(view.z, 0.9, 1.4);
    animateView({
      x: window.innerWidth / 2 - d.x * z,
      y: viewH() / 2 - d.y * z,
      z: z
    }, 650, function () {
      var n = nodeEls[id];
      if (n) {
        n.classList.remove('pulse');
        void n.offsetWidth;
        n.classList.add('pulse');
      }
      if (!skipOpen) openPanel(id);
    });
  }

  function runSearch(q) {
    q = q.trim().toLowerCase();
    resultsDiv.textContent = '';
    currentMatches = [];
    activeResult = -1;
    if (!q) { hideResults(); return; }
    var matches = state.datasets.filter(function (d) {
      if (d.name.toLowerCase().indexOf(q) !== -1) return true;
      if (entriesText(d).toLowerCase().indexOf(q) !== -1) return true;
      return d.groups.some(function (gid) {
        var g = groupById(gid);
        return g && g.name.toLowerCase().indexOf(q) !== -1;
      });
    }).slice(0, 8);
    currentMatches = matches;
    if (!matches.length) {
      var no = document.createElement('div');
      no.id = 'noresult';
      no.textContent = 'No dataset matches “' + q + '” yet.';
      resultsDiv.appendChild(no);
    } else {
      matches.forEach(function (d, idx) {
        var r = document.createElement('div');
        r.className = 'result';
        r.appendChild(typeIconEl(d.type));
        var nm = document.createElement('span');
        nm.className = 'rnm';
        nm.textContent = d.name;
        r.appendChild(nm);
        var gd = document.createElement('span');
        gd.className = 'rgroups';
        d.groups.forEach(function (gid) {
          var g = groupById(gid);
          if (!g) return;
          var i = document.createElement('i');
          i.style.background = g.color;
          gd.appendChild(i);
        });
        r.appendChild(gd);
        r.addEventListener('mousedown', function (e) {
          e.preventDefault();
          pickResult(idx);
        });
        resultsDiv.appendChild(r);
      });
    }
    resultsDiv.hidden = false;
  }

  function pickResult(idx) {
    var d = currentMatches[idx];
    if (!d) return;
    hideResults();
    searchInput.blur();
    focusNode(d.id);
  }

  searchInput.addEventListener('input', function () { runSearch(this.value); });
  searchInput.addEventListener('focus', function () { if (this.value.trim()) runSearch(this.value); });
  searchInput.addEventListener('blur', function () { setTimeout(hideResults, 150); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!currentMatches.length) return;
      activeResult = e.key === 'ArrowDown'
        ? (activeResult + 1) % currentMatches.length
        : (activeResult - 1 + currentMatches.length) % currentMatches.length;
      Array.prototype.forEach.call(resultsDiv.querySelectorAll('.result'), function (r, i) {
        r.classList.toggle('active', i === activeResult);
      });
    } else if (e.key === 'Enter') {
      pickResult(activeResult === -1 ? 0 : activeResult);
    } else if (e.key === 'Escape') {
      this.value = '';
      hideResults();
      this.blur();
    }
  });

  /* ---------- menu / import-export ---------- */
  var menu = el('menu');
  function closeMenu() { menu.hidden = true; }
  el('menuBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#menuwrap')) closeMenu();
  });

  var ioMode = 'export';
  /* ---------- backup ---------- */
  function backupJson() { return JSON.stringify(state, null, 2); }
  function backupFilename() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return 'datasets-backup-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.json';
  }
  function daysSince(ts) { return Math.floor((Date.now() - ts) / 86400000); }
  function backupAgeText() {
    if (!state.lastBackupAt) return 'never';
    var n = daysSince(state.lastBackupAt);
    return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago';
  }
  function refreshBackupLabel() { el('mExport').textContent = 'Back up data · ' + backupAgeText(); }
  function markBackedUp() {
    state.lastBackupAt = Date.now();
    state.backupSnoozedUntil = 0;
    persist();
    hideNudge();
    refreshBackupLabel();
  }
  function canShareFile(file) {
    try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); }
    catch (e) { return false; }
  }
  // Phone: the share sheet (Save to Files, iCloud Drive, AirDrop, Notes).
  // Elsewhere: the sheet with Save file / Copy.
  function backupNow() {
    var file = null;
    try { file = new File([backupJson()], backupFilename(), { type: 'application/json' }); } catch (e) { /* no File ctor */ }
    if (file && canShareFile(file)) {
      navigator.share({ files: [file], title: 'DATASETS backup' })
        .then(markBackedUp)
        .catch(function () { /* sheet dismissed */ });
      return;
    }
    openExportSheet();
  }
  function downloadBackup() {
    var blob = new Blob([backupJson()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = backupFilename();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    markBackedUp();
  }
  function openExportSheet() {
    ioMode = 'export';
    el('ioTag').textContent = 'backup';
    el('ioTitle').textContent = 'Back up your data';
    el('ioHelp').textContent = 'Save this as a file, or copy it somewhere safe (a note, an email to yourself). Restore it later with Import.';
    el('ioText').value = backupJson();
    el('ioAction').textContent = 'Copy';
    el('ioDownload').hidden = false;
    el('ioFileBtn').hidden = true;
    el('ioOverlay').hidden = false;
  }
  function hideNudge() { el('backupNudge').hidden = true; }
  // Returns 'busy' when another surface is up, so the caller can retry.
  function maybeShowBackupNudge() {
    if (state.datasets.length < 3) return 'skip';              // nothing worth losing yet
    if (Date.now() < (state.backupSnoozedUntil || 0)) return 'skip';
    var due = state.lastBackupAt ? daysSince(state.lastBackupAt) >= 14
                                 : daysSince(state.firstOpenAt || Date.now()) >= 2;
    if (!due) return 'skip';
    var overlayOpen = Array.prototype.some.call(document.querySelectorAll('.overlay'), function (o) { return !o.hidden; });
    if (overlayOpen || !el('wrap').hidden || !panel.hidden) return 'busy';
    var n = state.datasets.length, e = 0;
    state.datasets.forEach(function (d) { e += (d.entries || []).length; });
    el('nudgeBody').textContent = 'Your ' + n + ' sources and ' + e + ' notes live only on this device. Last backup: ' + backupAgeText() + '.';
    el('backupNudge').hidden = false;
    return 'shown';
  }
  function scheduleBackupNudge(tries) {
    setTimeout(function () {
      if (maybeShowBackupNudge() === 'busy' && tries > 0) scheduleBackupNudge(tries - 1);
    }, 3000);
  }
  el('nudgeNow').addEventListener('click', backupNow);
  el('nudgeLater').addEventListener('click', function () {
    state.backupSnoozedUntil = Date.now() + 7 * 86400000;
    persist();
    hideNudge();
  });
  el('ioDownload').addEventListener('click', downloadBackup);
  el('ioFileBtn').addEventListener('click', function () { el('ioFile').click(); });
  el('ioFile').addEventListener('change', function () {
    var f = el('ioFile').files && el('ioFile').files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      el('ioText').value = String(r.result || '');
      el('ioHelp').textContent = 'Loaded ' + f.name + ' — press Import & replace to restore it.';
    };
    r.readAsText(f);
    el('ioFile').value = '';
  });

  el('mExport').addEventListener('click', function () { closeMenu(); backupNow(); });
  el('mImport').addEventListener('click', function () {
    closeMenu();
    ioMode = 'import';
    el('ioTag').textContent = 'restore';
    el('ioTitle').textContent = 'Import data';
    el('ioHelp').textContent = 'Paste a previously exported JSON below. This replaces everything currently in the graph.';
    el('ioText').value = '';
    el('ioAction').textContent = 'Import & replace';
    el('ioDownload').hidden = true;
    el('ioFileBtn').hidden = false;
    el('ioOverlay').hidden = false;
    el('ioText').focus();
  });
  el('ioCancel').addEventListener('click', function () { el('ioOverlay').hidden = true; });
  el('ioAction').addEventListener('click', function () {
    if (ioMode === 'export') {
      var ta = el('ioText');
      ta.select();
      var copied = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function () {});
        copied = true;
      }
      try { if (!copied) document.execCommand('copy'); } catch (e) { /* manual copy */ }
      el('ioAction').textContent = 'Copied';
      setTimeout(function () { el('ioAction').textContent = 'Copy'; }, 1500);
      markBackedUp();
    } else {
      var parsed;
      try { parsed = JSON.parse(el('ioText').value); }
      catch (e) { el('ioHelp').textContent = 'That is not valid JSON — check the paste and try again.'; return; }
      if (!parsed || !Array.isArray(parsed.datasets) || !Array.isArray(parsed.groups)) {
        el('ioHelp').textContent = 'That JSON does not look like a DATASETS export (missing datasets/groups).';
        return;
      }
      if (!confirm('Replace the current graph with the imported data?')) return;
      state = migrate(parsed);
      activeFilter = null;
      persist();
      el('ioOverlay').hidden = true;
      closePanel();
      render();
      fitView();
    }
  });

  el('mClear').addEventListener('click', function () {
    closeMenu();
    if (!confirm('Delete ALL datasets and groups? Export first if you want a backup.')) return;
    state.datasets = [];
    state.groups = [];
    activeFilter = null;
    persist();
    closePanel();
    render();
  });

  /* ---------- native zoom lock ---------- */
  // iOS Safari fires proprietary gesture events for native pinch-zoom of
  // the page; cancelling them keeps the UI at 1:1 while the map's own
  // pointer-based pinch (on #canvas, touch-action:none) still works
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });

  /* ---------- global keys ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!el('addOverlay').hidden) el('addOverlay').hidden = true;
      else if (!el('promptOverlay').hidden) el('promptOverlay').hidden = true;
      else if (!el('ioOverlay').hidden) el('ioOverlay').hidden = true;
      else if (!el('wrap').hidden) closeWrap();
      else if (!el('rsOverlay').hidden) el('rsOverlay').hidden = true;
      else if (!el('groupsOverlay').hidden) { el('groupsOverlay').hidden = true; if (panelId) openPanel(panelId); }
      else if (!panel.hidden) closePanel();
      else closeMenu();
    } else if (e.key === '/' && document.activeElement === document.body) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  window.addEventListener('resize', function () { applyView(); });

  /* ---------- boot ---------- */
  state = migrate(load());
  if (state.meName === 'Burak') { state.meName = 'Burak Ekmen'; persist(); }
  // Tab still open on the device -> hold the exact position (per-tab
  // sessionStorage survives while the tab lives, even across a refresh or a
  // browser-forced reload). App/tab closed and relaunched -> sessionStorage
  // is gone -> open recentered on the full map.
  var sessView = null;
  try { sessView = JSON.parse(sessionStorage.getItem('datasets-session-view') || 'null'); } catch (e) { /* ignore */ }
  var holdView = sessView && typeof sessView.x === 'number';
  if (holdView) view = { x: sessView.x, y: sessView.y, z: sessView.z || 1 };
  try {
    if (location.protocol === 'capacitor:') {
      var saProbe = document.createElement('div');
      saProbe.style.cssText = 'position:fixed;top:0;left:0;height:env(safe-area-inset-top,0px);width:1px;visibility:hidden;pointer-events:none;';
      document.body.appendChild(saProbe);
      if (saProbe.offsetHeight < 20) {
        document.documentElement.style.setProperty('--sat', '54px');
        document.documentElement.style.setProperty('--sab', '24px');
      }
      saProbe.remove();
    }
  } catch (e) { /* ignore */ }

  if (holdView) {
    applyView();
    render();
  } else {
    // relaunch from zero: open on the full map, centered, with a gentle
    // settle from slightly closer
    render();
    var fitT = fitTarget();
    var fitCx = (window.innerWidth / 2 - fitT.x) / fitT.z;
    var fitCy = (viewH() / 2 - fitT.y) / fitT.z;
    var fitZ0 = fitT.z * 1.12;
    view = { x: window.innerWidth / 2 - fitCx * fitZ0, y: viewH() / 2 - fitCy * fitZ0, z: fitZ0 };
    applyView();
    animateView(fitT, 700);
  }

  refreshBackupLabel();
  scheduleBackupNudge(20);

  // last month's wrap, once, if it had lessons; otherwise today's first
  // open gets the daily resurface card
  setTimeout(function () {
    var now = new Date();
    var prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    var prevKey = monthKeyOf(prev.getFullYear(), prev.getMonth());
    state.wrapSeen = state.wrapSeen || {};
    if (!state.wrapSeen[prevKey]) {
      state.wrapSeen[prevKey] = true;
      persist();
      if (openWrap(prev.getFullYear(), prev.getMonth())) return;
    }
    var today = now.toDateString();
    if (state.lastResurfaceDay !== today) {
      state.lastResurfaceDay = today;
      persist();
      showResurface();
    }
  }, 500);
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
